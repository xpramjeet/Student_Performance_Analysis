
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject | Student Performance System">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            margin-top: 0;
        }

        p {
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .save-btn, .back-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .back-btn {
            background: #e2e8f0;
            color: #1f2937;
        }

        .error {
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 7px;
            margin: 15px 0;
        }

        @media (max-width: 700px) {
            .container {
                margin: 20px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>✏️ Edit Subject</h1>
        <p>
            Update the subject name, code and maximum marks distribution.
        </p>

        {% if error %}
            <div class="error" role="alert">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <label for="subject_name">Subject Name</label>
            <input
                type="text"
                id="subject_name"
                name="subject_name"
                maxlength="100"
                value="{{ subject.subject_name }}"
                required
            >

            <label for="subject_code">Subject Code</label>
            <input
                type="text"
                id="subject_code"
                name="subject_code"
                maxlength="30"
                value="{{ subject.subject_code or '' }}"
                required
            >

            <label for="internal_max_marks">
                Internal Maximum Marks
            </label>
            <input
                type="number"
                id="internal_max_marks"
                name="internal_max_marks"
                min="0"
                max="1000"
                value="{{ subject.internal_max_marks }}"
                required
            >

            <label for="external_max_marks">
                External Maximum Marks
            </label>
            <input
                type="number"
                id="external_max_marks"
                name="external_max_marks"
                min="0"
                max="1000"
                value="{{ subject.external_max_marks }}"
                required
            >

            <div class="buttons">
                <button type="submit" class="save-btn">
                    💾 Save Changes
                </button>

                <a href="/manage-subjects" class="back-btn">
                    Cancel
                </a>
            </div>
        </form>
    </main>
</body>
</html>
