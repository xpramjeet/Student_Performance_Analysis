<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f4f6fb;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #243f87;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #243f87;
            font-weight: bold;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        #success-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            background: #d4edda;
            color: #155724;
            display: none;
        }

        #error-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            background: #f8d7da;
            color: #721c24;
            display: none;
        }

        #debug-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #eeeeee;
            color: #333;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🔐 Forgot Password</h2>

    <p>
        Enter your registered mobile number or email address.
        We will send you an OTP to reset your password.
    </p>

    <!-- MSG91 OTP Widget -->
    <div id="msg91-otp"></div>

    <!-- Success -->
    <div id="success-message"></div>

    <!-- Error -->
    <div id="error-message"></div>

    <!-- Debug -->
    <div id="debug-box"></div>

    <a href="/student-login" class="back">
        ← Back to Student Login
    </a>

</div>


<script>

/*
====================================================
MSG91 OTP WIDGET CONFIGURATION
====================================================
*/

var configuration = {

    /*
     * Your MSG91 OTP Widget ID
     */
    widgetId: "366941643137393132383133",

    /*
     * IMPORTANT:
     * Yahan apna ACTUAL MSG91 OTP Widget Token
     * paste karo.
     *
     * Actual token mujhe mat bhejna.
     */
    tokenAuth: "575597T1sBqCbxbN6ab8ab0bP1",

    /*
     * Identifier optional hai.
     * Widget khud mobile/email lega.
     */
    identifier: "",

    /*
     * OTP verification successful
     */
    success: function (data) {

        console.log("================================");
        console.log("MSG91 SUCCESS RESPONSE");
        console.log(data);
        console.log("================================");

        showSuccess(
            "OTP verified successfully."
        );

        /*
         * Access token check
         */
        var accessToken = null;

        if (data) {

            accessToken =
                data.message ||
                data.access_token ||
                data.accessToken ||
                data.token ||
                null;

        }

        /*
         * Agar token data ke andar ho
         */
        if (!accessToken && data && data.data) {

            accessToken =
                data.data.message ||
                data.data.access_token ||
                data.data.accessToken ||
                data.data.token ||
                null;

        }

        console.log(
            "Access Token Received:",
            Boolean(accessToken)
        );


        /*
         * Token nahi mila
         */
        if (!accessToken) {

            showError(
                "OTP verified, but access token was not received."
            );

            showDebug(data);

            return;
        }


        /*
         * Flask backend ko access token bhejna
         */
        fetch("/verify-msg91-token", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                access_token: accessToken
            })

        })

        .then(function (response) {

            console.log(
                "Flask HTTP Status:",
                response.status
            );

            return response.json();

        })

        .then(function (result) {

            console.log(
                "Flask Response:",
                result
            );


            /*
             * Backend successful
             */
            if (result.success) {

                showSuccess(
                    "OTP verified. Opening password reset..."
                );

                setTimeout(function () {

                    window.location.href =
                        "/reset-password";

                }, 800);

            }

            /*
             * Backend failed
             */
            else {

                showError(
                    result.error ||
                    "MSG91 verification failed."
                );

                showDebug(result);

            }

        })

        .catch(function (error) {

            console.error(
                "SERVER ERROR:",
                error
            );

            showError(
                "Unable to connect with server."
            );

            showDebug(error);

        });

    },


    /*
     * OTP verification failed
     */
    failure: function (error) {

        console.log(
            "================================"
        );

        console.log(
            "MSG91 FAILURE RESPONSE"
        );

        console.log(error);

        console.log(
            "================================"
        );


        var errorText = "";

        try {

            errorText =
                JSON.stringify(
                    error,
                    null,
                    2
                );

        } catch (e) {

            errorText =
                String(error);

        }


        showError(
            "OTP verification failed."
        );

        showDebug(errorText);

    }

};


/*
====================================================
SUCCESS MESSAGE
====================================================
*/

function showSuccess(message) {

    var box =
        document.getElementById(
            "success-message"
        );

    box.innerText = message;

    box.style.display = "block";

}


/*
====================================================
ERROR MESSAGE
====================================================
*/

function showError(message) {

    var box =
        document.getElementById(
            "error-message"
        );

    box.innerText = message;

    box.style.display = "block";

}


/*
====================================================
DEBUG MESSAGE
====================================================
*/

function showDebug(data) {

    var box =
        document.getElementById(
            "debug-box"
        );

    var text = "";

    try {

        if (typeof data === "string") {

            text = data;

        } else {

            text =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }

    } catch (e) {

        text = String(data);

    }

    box.innerText =
        "Technical Details:\n\n" +
        text;

    box.style.display = "block";

}


/*
====================================================
LOAD MSG91 OTP SCRIPT
====================================================
*/

(function loadOtpScript(urls) {

    var i = 0;


    function attempt() {

        var script =
            document.createElement(
                "script"
            );

        script.src = urls[i];

        script.async = true;


        script.onload = function () {

            console.log(
                "MSG91 OTP script loaded:"
                + " "
                + urls[i]
            );


            if (
                typeof window.initSendOTP ===
                "function"
            ) {

                console.log(
                    "Initializing MSG91 OTP Widget..."
                );

                window.initSendOTP(
                    configuration
                );

            } else {

                console.error(
                    "initSendOTP function not found."
                );

                showError(
                    "MSG91 OTP Widget could not be initialized."
                );

            }

        };


        script.onerror = function () {

            console.error(
                "MSG91 script failed:",
                urls[i]
            );

            i++;


            if (i < urls.length) {

                attempt();

            } else {

                showError(
                    "Unable to load MSG91 OTP service."
                );

            }

        };


        document.head.appendChild(
            script
        );

    }


    attempt();

})([
    "https://verify.msg91.com/otp-provider.js",
    "https://verify.phone91.com/otp-provider.js"
]);

</script>

</body>

</html>
