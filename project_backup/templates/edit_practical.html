<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Practical Marks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .student-info {
            background: #f1f3f5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>✏️ Edit Practical Marks</h2>

    <div class="student-info">

        <strong>Student:</strong>
        {{ practical.student_name }}

        <br>

        <strong>Roll No:</strong>
        {{ practical.roll_no }}

    </div>

    <form method="POST">

        <label>Subject</label>

        <input
            type="text"
            name="subject"
            value="{{ practical.subject }}"
            required
        >


        <label>Obtained Marks</label>

        <input
            type="number"
            name="marks"
            value="{{ practical.marks }}"
            min="0"
            required
        >


        <label>Maximum Marks</label>

        <input
            type="number"
            name="max_marks"
            value="{{ practical.max_marks }}"
            min="1"
            required
        >


        <button type="submit">
            Update Practical Marks
        </button>

    </form>

    <a href="/practical" class="cancel">
        ← Cancel
    </a>

</div>

</body>

</html>
