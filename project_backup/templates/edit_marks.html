<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Marks</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .student-info {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #222;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #222;
        }

        button:hover {
            background: #000;
        }

        .back-btn:hover {
            background: #ccc;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>✏️ Edit Theory Marks</h1>

    <div class="student-info">

        <strong>Student:</strong>
        {{ mark.student_name }}

        <br><br>

        <strong>Roll No:</strong>
        {{ mark.roll_no }}

    </div>

    <form method="POST">

        <div class="form-group">

            <label>Subject</label>

            <input
                type="text"
                name="subject"
                value="{{ mark.subject }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Obtained Marks</label>

            <input
                type="number"
                name="marks"
                value="{{ mark.marks }}"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label>Maximum Marks</label>

            <input
                type="number"
                name="max_marks"
                value="{{ mark.max_marks }}"
                min="1"
                required
            >

        </div>


        <div class="buttons">

            <button type="submit">
                Update Marks
            </button>

            <a href="/marks" class="back-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
