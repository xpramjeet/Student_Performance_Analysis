<!DOCTYPE html>
<html>
<head>
    <title>Change Student Username</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #243f87;
            margin-bottom: 25px;
        }

        .info {
            background: #eef3ff;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .info p {
            margin: 7px 0;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #243f87;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b316b;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #243f87;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>✏️ Change Student Username</h2>

    <div class="info">
        <p><strong>Student Name:</strong> {{ account.student_name }}</p>
        <p><strong>Roll No:</strong> {{ account.roll_no }}</p>
        <p><strong>Current Username:</strong> {{ account.username }}</p>
    </div>

    {% if message %}
        <div class="success">
            {{ message }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>New Username</label>

        <input
            type="text"
            name="new_username"
            placeholder="Enter new username"
            required
        >

        <button type="submit">
            Change Username
        </button>

    </form>

    <a href="/student-accounts" class="back">
        ← Back to Student Accounts
    </a>

</div>

</body>
</html>
