<!DOCTYPE html>
<html>
<head>
    <title>Edit Assignment</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .header {
            background: #243f87;
            color: white;
            padding: 20px 40px;
            font-size: 40px;
            font-weight: bold;
        }

        .container {
            width: 600px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #243f87;
            margin-bottom: 30px;
        }

        .student-info {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .student-info p {
            margin: 8px 0;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #243f87;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        Student Performance Analysis and Management System
    </div>

    <div class="container">

        <h2>Edit Assignment</h2>

        <div class="student-info">

            <p>
                Student Name:
                {{ assignment.student_name }}
            </p>

            <p>
                Roll No:
                {{ assignment.roll_no }}
            </p>

        </div>

        <form method="POST">

            <label>Assignment Title</label>

            <input
                type="text"
                name="title"
                value="{{ assignment.title }}"
                required
            >

            <label>Subject</label>

            <input
                type="text"
                name="subject"
                value="{{ assignment.subject }}"
                required
            >

            <label>Marks</label>

            <input
                type="number"
                name="marks"
                value="{{ assignment.marks }}"
                min="0"
                required
            >

            <label>Maximum Marks</label>

            <input
                type="number"
                name="max_marks"
                value="{{ assignment.max_marks }}"
                min="1"
                required
            >

            <label>Submission Status</label>

            <select name="submission_status" required>

                <option
                    value="Submitted"
                    {% if assignment.submission_status == "Submitted" %}
                    selected
                    {% endif %}
                >
                    Submitted
                </option>

                <option
                    value="Pending"
                    {% if assignment.submission_status == "Pending" %}
                    selected
                    {% endif %}
                >
                    Pending
                </option>

                <option
                    value="Late"
                    {% if assignment.submission_status == "Late" %}
                    selected
                    {% endif %}
                >
                    Late
                </option>

            </select>

            <button type="submit">
                Update Assignment
            </button>

        </form>

        <a href="/assignments" class="back">
            ← Back to Assignments
        </a>

    </div>

</body>
</html>
