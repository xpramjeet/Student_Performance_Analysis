<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .header {
            background: #243f87;
            color: white;
            padding: 20px 40px;
            font-size: 30px;
            font-weight: bold;
        }

        .container {
            width: 650px;
            margin: 60px auto;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #243f87;
            margin-bottom: 30px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 5px;
            border-bottom: 1px solid #ddd;
            font-size: 17px;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #243f87;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="header">
        Student Performance Analysis System
    </div>

    <div class="container">

        <div class="profile-card">

            <h2>👤 My Profile</h2>

            <div class="profile-row">
                <span class="label">Student Name</span>
                <span class="value">{{ student.student_name }}</span>
            </div>

            <div class="profile-row">
                <span class="label">Roll Number</span>
                <span class="value">{{ student.roll_no }}</span>
            </div>

            <div class="profile-row">
                <span class="label">Course</span>
                <span class="value">{{ student.course }}</span>
            </div>

            <div class="profile-row">
                <span class="label">Semester</span>
                <span class="value">{{ student.semester }}</span>
            </div>

            <div class="profile-row">
                <span class="label">Email</span>
                <span class="value">{{ student.email }}</span>
            </div>

            <div class="profile-row">
                <span class="label">Phone</span>
                <span class="value">{{ student.phone }}</span>
            </div>

        </div>

        <a href="/student-dashboard" class="back">
            ← Back to Student Dashboard
        </a>

    </div>

</body>
</html>
