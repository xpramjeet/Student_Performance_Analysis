<!DOCTYPE html>
<html>
<head>

    <title>Admin Login - Student Performance System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #243f87, #4f6fb5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #243f87;
            margin: 5px 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #243f87;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #243f87;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b316b;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .student-login {
            text-align: center;
            margin-top: 25px;
        }

        .student-login a {
            color: #243f87;
            text-decoration: none;
            font-weight: bold;
        }

        .student-login a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 25px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        🎓
    </div>

    <h1>Admin Login</h1>

    <div class="subtitle">
        Student Performance Analysis & Management System
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >


        <button type="submit">
            🔐 Login
        </button>

    </form>


    <div class="student-login">

        Student?

        <a href="/student-login">
            Student Login
        </a>

    </div>


    <div class="footer">
        Student Performance Analysis System
    </div>

</div>

</body>
</html>
