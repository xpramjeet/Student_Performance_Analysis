<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student | Student Performance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #2447a8;
            --primary-dark: #18347f;
            --background: #f3f6fc;
            --text: #1e293b;
            --muted: #64748b;
            --border: #dbe3f0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .header {
            background: linear-gradient(120deg, #172554, #2447a8, #3566d6);
            color: white;
            padding: 28px 5%;
            box-shadow: 0 5px 18px rgba(23, 37, 84, 0.16);
        }

        .header h1 {
            font-size: clamp(22px, 3vw, 30px);
            line-height: 1.4;
            margin-bottom: 7px;
        }

        .header p {
            color: #dbeafe;
            font-size: 14px;
        }

        .container {
            width: 92%;
            max-width: 760px;
            margin: 35px auto;
        }

        .form-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
        }

        .card-heading {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(to right, #ffffff, #f7f9ff);
        }

        .heading-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-bottom: 13px;
            border-radius: 13px;
            background: #e8efff;
            font-size: 24px;
        }

        .card-heading h2 {
            color: #172554;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .card-heading p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-body {
            padding: 28px 30px 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 21px 20px;
        }

        .form-group {
            min-width: 0;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        .required {
            color: #dc2626;
        }

        input {
            display: block;
            width: 100%;
            min-height: 45px;
            padding: 12px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #f8faff;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(36, 71, 168, 0.11);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .field-hint {
            margin-top: 6px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            padding-top: 23px;
            border-top: 1px solid #edf0f6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-height: 46px;
            padding: 12px 17px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .update-btn {
            background: linear-gradient(110deg, #2447a8, #3565cc);
            color: white;
            box-shadow: 0 5px 12px rgba(36, 71, 168, 0.17);
        }

        .update-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: white;
            color: #475569;
            border-color: var(--border);
        }

        .cancel-btn:hover {
            background: #f1f5f9;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 20px 0;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 22px auto;
            }

            .card-heading {
                padding: 22px;
            }

            .form-body {
                padding: 23px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .card-heading h2 {
                font-size: 22px;
            }
        }

        @media (max-width: 380px) {
            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Student Performance Analysis and Management System</h1>
        <p>Student Records &bull; Update Information</p>
    </header>

    <main class="container">

        <section class="form-card">

            <div class="card-heading">
                <div class="heading-icon" aria-hidden="true">✏️</div>

                <h2>Edit Student Details</h2>

                <p>
                    Update the student's academic and contact information
                    using the form below.
                </p>
            </div>

            <div class="form-body">

                <form method="POST">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="roll_no">
                                Roll Number <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="roll_no"
                                name="roll_no"
                                value="{{ student.roll_no }}"
                                autocomplete="off"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="student_name">
                                Student Name <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="student_name"
                                name="student_name"
                                value="{{ student.student_name }}"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="course">
                                Course <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="course"
                                name="course"
                                value="{{ student.course }}"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="semester">
                                Semester <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="semester"
                                name="semester"
                                value="{{ student.semester }}"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                value="{{ student.email }}"
                                autocomplete="email"
                            >
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                value="{{ student.phone }}"
                                autocomplete="tel"
                            >
                        </div>

                    </div>

                    <div class="buttons">
                        <button type="submit" class="btn update-btn">
                            &#10003; Update Student
                        </button>

                        <a href="/students" class="btn cancel-btn">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </section>

        <footer class="footer">
            Student Performance Analysis and Management System
        </footer>

    </main>

</body>
</html>
```
