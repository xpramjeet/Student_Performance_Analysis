<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Student Performance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #2447a8;
            --primary-dark: #18347f;
            --text: #1e293b;
            --muted: #64748b;
            --border: #dbe3f0;
        }

        body {
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, #4777d9 0, transparent 35%),
                linear-gradient(135deg, #101d45, #2447a8 55%, #4775cb);
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 24px 65px rgba(5, 15, 45, 0.28);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #e9efff, #dce7ff);
            font-size: 39px;
            box-shadow: inset 0 0 0 1px #d4e0ff;
        }

        .brand h1 {
            color: #172554;
            font-size: 27px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 15px;
            color: #3156a8;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 650;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #f8faff;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(36, 71, 168, 0.12);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px;
        }

        .toggle-password:hover {
            color: var(--primary-dark);
        }

        .error {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 9px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            margin-top: 7px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(110deg, #2447a8, #3565cc);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 15px rgba(36, 71, 168, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(36, 71, 168, 0.28);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .student-login {
            margin-top: 25px;
            padding-top: 21px;
            border-top: 1px solid #edf0f6;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .student-login a {
            display: inline-block;
            margin-left: 4px;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .student-login a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 24px;
            color: #94a3b8;
            text-align: center;
            font-size: 11px;
            line-height: 1.6;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
                border-radius: 16px;
            }

            .brand h1 {
                font-size: 24px;
            }

            .logo {
                width: 68px;
                height: 68px;
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="brand">
            <div class="logo" aria-hidden="true">🎓</div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Student Performance Analysis &amp;<br>
                Management System
            </p>

            <div class="security-note">
                <span aria-hidden="true">🔒</span>
                Authorized Administrator Access
            </div>
        </div>

        {% if error %}
        <div class="error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-controls="password"
                        aria-pressed="false"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <span aria-hidden="true">🔐</span>
                Login to Dashboard
            </button>
        </form>

        <div class="student-login">
            Are you a student?
            <a href="/student-login">Student Login &rarr;</a>
        </div>

        <footer class="footer">
            Student Performance Analysis and Management System
        </footer>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        toggleButton.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            toggleButton.textContent = isHidden ? "Hide" : "Show";
            toggleButton.setAttribute("aria-pressed", String(isHidden));
        });
    </script>

</body>
</html>
```
