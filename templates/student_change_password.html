<!DOCTYPE html>
<html>
<head>

    <title>Change Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .header {
            background: #243f87;
            color: white;
            padding: 22px 40px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            width: 450px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #243f87;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #243f87;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b316b;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #243f87;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="header">
    Student Performance Analysis System
</div>

<div class="container">

    <div class="card">

        <h2>🔐 Change Password</h2>

        {% if message %}
            <div class="success">
                {{ message }}
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Current Password</label>

            <input
                type="password"
                name="current_password"
                placeholder="Enter current password"
                required
            >


            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                placeholder="Enter new password"
                minlength="6"
                required
            >


            <label>Confirm New Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >


            <button type="submit">
                🔐 Change Password
            </button>

        </form>

        <a href="/student-dashboard" class="back">
            ← Back to Student Dashboard
        </a>

    </div>

</div>

</body>
</html>
