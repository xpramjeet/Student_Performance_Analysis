<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #222;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #222;
        }

        button:hover {
            background: #000;
        }

        .back-btn:hover {
            background: #ccc;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>✏️ Edit Student</h1>

    <form method="POST">

        <div class="form-group">

            <label>Roll Number</label>

            <input
                type="text"
                name="roll_no"
                value="{{ student.roll_no }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Student Name</label>

            <input
                type="text"
                name="student_name"
                value="{{ student.student_name }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Course</label>

            <input
                type="text"
                name="course"
                value="{{ student.course }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Semester</label>

            <input
                type="text"
                name="semester"
                value="{{ student.semester }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                value="{{ student.phone }}"
            >

        </div>


        <div class="buttons">

            <button type="submit">
                Update Student
            </button>

            <a href="/students" class="back-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
